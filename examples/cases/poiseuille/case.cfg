mesh.path = ../../meshes/poiseuille
output.path = result

fluid.rho = 1.0
fluid.mu = 0.01

schemes.ddt = steadyState
schemes.div_u = upwind
schemes.grad_p = central
schemes.laplacian_u = orthogonal
schemes.interpolation = linear

solution.algorithm = SIMPLE
solution.velocity.solver = BiCGSTAB
solution.velocity.preconditioner = ILUT
solution.velocity.absolute_tolerance = 1e-14
solution.velocity.relative_tolerance = 1e-7
solution.velocity.max_iterations = 200
solution.velocity.warm_start = true

solution.pressure.solver = PCG
solution.pressure.preconditioner = incompleteCholesky
solution.pressure.absolute_tolerance = 1e-14
solution.pressure.relative_tolerance = 1e-7
solution.pressure.max_iterations = 1000
solution.pressure.warm_start = false

solution.simple.max_iterations = 1000
solution.simple.pressure_relaxation = 0.3
solution.simple.velocity_relaxation = 0.5
solution.simple.continuity_tolerance = 1e-7
solution.simple.velocity_change_tolerance = 1e-6
